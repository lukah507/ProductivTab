<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ProductivTab — Custom New Tab</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div id="root">

    <!-- Icon-only note button, top-left. Toggles the notes panel open/closed (js/notes.js). -->
    <button id="add-note-fab" class="icon-btn" title="Toggle notes" aria-label="Toggle notes panel">
      <img class="icon-btn-img" src="icons/note.png" alt="">
    </button>

    <!-- Sits next to the note icon (see #notes-add-btn in style.css for
         positioning); only visible while the notes panel is open --
         js/notes.js toggles the .open class on it alongside the panel. -->
    <button id="notes-add-btn" class="notes-add-btn" type="button">+</button>

    <!-- Center stack (date / time) -->
    <main id="center-stack">
      <div id="date" class="center-date" aria-live="polite"></div>
      <div id="time" class="center-time" aria-live="polite"></div>
    </main>

    <!-- Settings panel: opened by the gear button (js/settings.js). Starts
         at the top and is sized (via JS, on open) to reach no further
         than the bottom edge of the clock -- see sizePanelToTime() in
         js/settings.js. Aesthetic matches the notes panel (translucent
         black), just anchored top/right instead of a full-height left
         drawer. -->
    <div id="settings-panel" class="settings-panel" aria-hidden="true">
      <div class="settings-panel-inner">

        <section class="settings-section">
          <h2 class="settings-section-title">Themes</h2>
          <!-- Populated by js/settings.js: one tile per image actually
               found in the bg/ folder, plus a trailing "+" tile to add
               more. If the folder isn't connected yet, this instead shows
               a single "Connect backgrounds folder" button. -->
          <div id="theme-grid" class="theme-grid"></div>
          <input id="bg-file-input" type="file" accept="image/png,image/jpeg,image/jpg" hidden>
        </section>

        <section class="settings-section">
          <h2 class="settings-section-title">Clock</h2>
          <div class="settings-toggle-row">
            <span class="settings-toggle-row-label">Hour format</span>
            <button id="clock-toggle" class="settings-toggle" type="button" aria-pressed="false" title="Toggle 12/24 hour clock">
              <span class="settings-toggle-track">
                <span class="settings-toggle-thumb"></span>
                <span class="settings-toggle-label settings-toggle-label--off">12h</span>
                <span class="settings-toggle-label settings-toggle-label--on">24h</span>
              </span>
            </button>
          </div>
          <div class="settings-toggle-row">
            <span class="settings-toggle-row-label">Seconds</span>
            <button id="seconds-toggle" class="settings-toggle" type="button" aria-pressed="true" title="Show/hide seconds">
              <span class="settings-toggle-track">
                <span class="settings-toggle-thumb"></span>
                <span class="settings-toggle-label settings-toggle-label--off">Off</span>
                <span class="settings-toggle-label settings-toggle-label--on">On</span>
              </span>
            </button>
          </div>
        </section>

      </div>
    </div>

    <!-- Notes drawer: toggled open/closed by the note button (js/notes.js).
         Slides in from the left, full viewport height. -->
    <div id="notes-panel" class="notes-panel" aria-hidden="true">
      <div class="notes-panel-inner">
        <div id="notes-list"></div>
      </div>
    </div>

    <!-- Bottom bar wrapper (overlay + visible bar). This is now the only
         shortcuts bar -- the old top bar was removed. In its place,
         #bar-switcher (js/links.js) lets you flip between several saved
         sets of links without cluttering the row itself: both the
         switcher and the add button are absolutely positioned on top of
         the bar rather than sitting in its flex flow, so toggling them
         never shifts the shortcuts. -->
    <div id="bottom-bar-wrap" class="bar-wrap">
      <div id="bottom-bar-overlay" class="bar-overlay" title="Bottom overlay area"></div>

      <div id="bar-switcher" class="bar-switcher" aria-label="Switch link set">
        <div id="bar-dots" class="bar-dots"></div>
        <button id="bar-add-set" class="bar-switch-add" type="button" title="Add a new link set">+</button>
      </div>

      <div id="bottom-bar" class="link-bar" aria-label="Bookmarks bar"></div>
      <button id="bottom-add-btn" class="plus-btn" type="button" title="Add link" aria-label="Add link">+</button>
    </div>

  </div>

  <!-- Settings button (top-right; icon-only, no background) -->
  <button id="settings-button" class="icon-btn" aria-label="Settings">
    <img class="icon-btn-img" src="icons/setting.png" alt="">
  </button>

  <script type="module" src="main.js"></script>
</body>
</html>
