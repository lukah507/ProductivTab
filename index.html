<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ProductivTab — Custom New Tab</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div id="root">

    <!-- Top bar wrapper (overlay + visible bar) -->
    <div id="top-bar-wrap" class="bar-wrap">
      <div id="top-bar-overlay" class="bar-overlay" title="Top overlay area"></div>
      <div id='top-bar' class="link-bar" aria-label="Top bookmarks bar"></div>
      <button id="top-add-btn" class="mini-btn" title="Add top link">+ Add</button>
    </div>

    <!-- Icon-only note button, top-left, level with the top bar overlay.
         Toggles the notes panel open/closed (js/notes.js). -->
    <button id="add-note-fab" class="icon-btn" title="Toggle notes" aria-label="Toggle notes panel">
      <img class="icon-btn-img" src="icons/note.png" alt="">
    </button>

    <!-- Sits next to the note icon (see #notes-add-btn in style.css for
         positioning); only visible while the notes panel is open --
         js/notes.js toggles the .open class on it alongside the panel. -->
    <button id="notes-add-btn" class="notes-add-btn" type="button">+</button>

    <!-- Center stack (date / time) -->
    <main id="center-stack">
      <div id="date" class="center-date" aria-live="polite"></div>
      <div id="time" class="center-time" aria-live="polite"></div>
    </main>

    <!-- Settings / controls -- appear as a vertical list below the settings button -->
    <div id="center-controls" class="center-controls hidden" aria-hidden="true">
      <button id="clock-toggle" class="mini-btn">12/24</button>

      <label for="bg-upload" class="mini-btn file-label">Upload BG</label>
      <input id="bg-upload" type="file" accept="image/*" multiple style="display:none">

      <!-- Color picker for icon/text color (keeps icons and center text separate) -->
      <div class="control-row">
        <input id="color-input" type="color" class="color-input" title="Pick a color">
        <button id="color-apply" class="mini-btn">Apply Color</button>
      </div>
    </div>

    <!-- Notes drawer: toggled open/closed by the note button (js/notes.js).
         Slides in from the left, full viewport height. -->
    <div id="notes-panel" class="notes-panel" aria-hidden="true">
      <div class="notes-panel-inner">
        <div id="notes-list"></div>
      </div>
    </div>

    <!-- Bottom bar wrapper (overlay + visible bar) -->
    <div id="bottom-bar-wrap" class="bar-wrap">
      <div id="bottom-bar-overlay" class="bar-overlay" title="Bottom overlay area"></div>
      <div id="bottom-bar" class="link-bar" aria-label="Bottom bookmarks bar"></div>
      <button id="bottom-add-btn" class="mini-btn" title="Add bottom link">+ Add</button>
    </div>

  </div>

  <!-- Settings button (top-right; icon-only, no background) -->
  <button id="settings-button" class="icon-btn" aria-label="Settings">
    <img class="icon-btn-img" src="icons/setting.png" alt="">
  </button>

  <script type="module" src="main.js"></script>
</body>
</html>
